<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мозг Робота</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 15px; }
    button { font-size: 18px; padding: 15px; margin: 6px; border: none; border-radius: 12px; background: #2979ff; color: white; font-weight: bold; }
    button:active { background: #1565c0; }
    .stop { background: #d50000; width: 90%; font-size: 22px; }
    .connect { background: #00c853; width: 90%; margin-bottom: 15px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 340px; margin: 15px auto; }
    .status { color: #ffab00; margin: 10px 0; font-size: 16px; }
    .inv-box { background: #1e1e1e; padding: 10px; border-radius: 10px; margin-top: 20px; font-size: 14px; }
  </style>
</head>
<body>
  <h2>🤖 Пульт Робота (Этап 1)</h2>
  <button class="connect" onclick="connectBLE()">🔗 Подключиться к ESP32_Roma_Bot</button>
  <div class="status" id="status">Статус: Не подключено</div>

  <div class="grid">
    <div></div>
    <button onpointerdown="move(180, 180, 0)" onpointerup="stopBot()">⬆️ Вперёд</button>
    <div></div>

    <button onpointerdown="move(-180, 180, 0)" onpointerup="stopBot()">↺ Влево</button>
    <button onpointerdown="move(0, 0, 180)" onpointerup="stopBot()">⚙️ Заднее</button>
    <button onpointerdown="move(180, -180, 0)" onpointerup="stopBot()">↻ Вправо</button>

    <div></div>
    <button onpointerdown="move(-180, -180, 0)" onpointerup="stopBot()">⬇️ Назад</button>
    <div></div>
  </div>

  <button class="stop" onclick="stopBot()">🛑 СТОП</button>

  <div class="inv-box">
    <b>Если колесо крутится не туда (поставь галочку):</b><br><br>
    <label><input type="checkbox" id="invL"> Инверсия Левого</label> |
    <label><input type="checkbox" id="invR"> Инверсия Правого</label> |
    <label><input type="checkbox" id="invB"> Инверсия Заднего</label>
  </div>

  <script>
    let rxChar = null;
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    async function connectBLE() {
      try {
        document.getElementById('status').innerText = "Поиск робота...";
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ESP32_Roma_Bot' }],
          optionalServices: [SERVICE_UUID]
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxChar = await service.getCharacteristic(RX_UUID);
        document.getElementById('status').innerText = "✅ Подключено к роботу!";
      } catch (e) {
        document.getElementById('status').innerText = "Ошибка: " + e;
      }
    }

    async function sendCmd(text) {
      if (!rxChar) return;
      const encoder = new TextEncoder();
      await rxChar.writeValueWithoutResponse(encoder.encode(text));
    }

    function move(l, r, b) {
      if (document.getElementById('invL').checked) l = -l;
      if (document.getElementById('invR').checked) r = -r;
      if (document.getElementById('invB').checked) b = -b;
      sendCmd(${l},${r},${b});
    }

    function stopBot() {
      sendCmd("0,0,0");
    }
  </script>
</body>
</html>
